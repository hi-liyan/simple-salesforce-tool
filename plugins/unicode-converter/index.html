<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Unicode 编码转换</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, sans-serif; color: #1e293b; background: #fff; }
      .wrap { display: flex; flex-direction: column; height: 100%; padding: 12px; gap: 10px; }
      .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      button { border: 1px solid #cbd5e1; border-radius: 8px; padding: 6px 12px; background: #fff; cursor: pointer; font-size: 12px; }
      button.primary { background: #0176d3; border-color: #0176d3; color: #fff; }
      .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      textarea { width: 100%; height: 100%; resize: none; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="toolbar">
        <button class="primary" id="btnToUni">中文 -> Unicode</button>
        <button id="btnToCn">Unicode / 实体 -> 中文</button>
        <button id="btnCopy">复制输出</button>
      </div>
      <div class="grid">
        <textarea id="input" placeholder="输入文本或 \u4e2d\u6587 / &#20013;&#25991;..."></textarea>
        <textarea id="output" readonly placeholder="转换结果..."></textarea>
      </div>
    </div>
    <script>
      let seq = 0;
      function callHost(method, args = {}) {
        return new Promise((resolve, reject) => {
          const requestId = "rpc-" + ++seq;
          function onMsg(ev) {
            const d = ev.data || {};
            if (d.channel !== "sst:plugin-rpc-response" || d.requestId !== requestId) return;
            window.removeEventListener("message", onMsg);
            d.ok ? resolve(d.result) : reject(new Error(d.error || "RPC failed"));
          }
          window.addEventListener("message", onMsg);
          window.parent.postMessage({ channel: "sst:plugin-rpc", requestId, method, args }, "*");
        });
      }

      const inputEl = document.getElementById("input");
      const outputEl = document.getElementById("output");

      document.getElementById("btnToUni").onclick = () => {
        outputEl.value = Array.from(inputEl.value)
          .map((ch) => {
            const code = ch.charCodeAt(0);
            return code > 127 ? "\\u" + code.toString(16).padStart(4, "0") : ch;
          })
          .join("");
        void callHost("storage.set", { key: "lastInput", value: inputEl.value });
      };

      document.getElementById("btnToCn").onclick = () => {
        outputEl.value = inputEl.value
          .replace(/\\u([0-9a-fA-F]{4})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)))
          .replace(/&#(\d+);/g, (_, dec) => String.fromCharCode(parseInt(dec, 10)))
          .replace(/&#x([0-9a-fA-F]+);/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)));
        void callHost("storage.set", { key: "lastInput", value: inputEl.value });
      };

      document.getElementById("btnCopy").onclick = async () => {
        if (!outputEl.value) return;
        await navigator.clipboard.writeText(outputEl.value);
        await callHost("ui.notify", { message: "已复制转换结果", tone: "success" });
      };

      callHost("init")
        .then(() => callHost("storage.get", { key: "lastInput" }))
        .then((val) => {
          if (typeof val === "string") inputEl.value = val;
        })
        .catch(() => {});
    </script>
  </body>
</html>
