<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>JSON 格式化</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, sans-serif; color: #1e293b; background: #fff; }
      .wrap { display: flex; flex-direction: column; height: 100%; padding: 12px; gap: 10px; }
      .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      button { border: 1px solid #cbd5e1; border-radius: 8px; padding: 6px 12px; background: #fff; color: #1e293b; cursor: pointer; font-size: 12px; }
      button.primary { background: #0176d3; border-color: #0176d3; color: #fff; }
      .status { margin-left: auto; font-size: 12px; color: #64748b; }
      .status.err { color: #dc2626; }
      .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      textarea { width: 100%; height: 100%; resize: none; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; line-height: 1.5; outline: none; }
      textarea:focus { border-color: #0176d3; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="toolbar">
        <button class="primary" id="btnFormat">格式化 (2空格)</button>
        <button id="btnMinify">压缩</button>
        <button id="btnCopy">复制结果</button>
        <button id="btnReadSel">读取编辑器选区</button>
        <button id="btnClear">清空</button>
        <span class="status" id="status">就绪</span>
      </div>
      <div class="grid">
        <textarea id="input" placeholder="粘贴或输入原始 JSON..."></textarea>
        <textarea id="output" readonly placeholder="格式化结果..."></textarea>
      </div>
    </div>
    <script>
      let seq = 0;
      function callHost(method, args = {}) {
        return new Promise((resolve, reject) => {
          const requestId = "rpc-" + ++seq;
          function onMsg(ev) {
            const d = ev.data || {};
            if (d.channel !== "sst:plugin-rpc-response" || d.requestId !== requestId) return;
            window.removeEventListener("message", onMsg);
            d.ok ? resolve(d.result) : reject(new Error(d.error || "RPC failed"));
          }
          window.addEventListener("message", onMsg);
          window.parent.postMessage({ channel: "sst:plugin-rpc", requestId, method, args }, "*");
        });
      }

      const inputEl = document.getElementById("input");
      const outputEl = document.getElementById("output");
      const statusEl = document.getElementById("status");

      function formatJson(indent) {
        try {
          const parsed = JSON.parse(inputEl.value);
          outputEl.value = JSON.stringify(parsed, null, indent);
          statusEl.textContent = "JSON 合法";
          statusEl.className = "status";
          void callHost("storage.set", { key: "draft", value: inputEl.value });
        } catch (err) {
          statusEl.textContent = "语法错误: " + err.message;
          statusEl.className = "status err";
        }
      }

      document.getElementById("btnFormat").onclick = () => formatJson(2);
      document.getElementById("btnMinify").onclick = () => formatJson(0);
      document.getElementById("btnClear").onclick = () => {
        inputEl.value = "";
        outputEl.value = "";
        statusEl.textContent = "已清空";
        statusEl.className = "status";
      };
      document.getElementById("btnCopy").onclick = async () => {
        if (!outputEl.value) return;
        await navigator.clipboard.writeText(outputEl.value);
        await callHost("ui.notify", { message: "已复制格式化结果", tone: "success" });
      };
      document.getElementById("btnReadSel").onclick = async () => {
        const sel = await callHost("workspace.getActiveEditorSelection");
        if (sel) {
          inputEl.value = sel;
          formatJson(2);
        }
      };

      callHost("init")
        .then(() => callHost("storage.get", { key: "draft" }))
        .then((saved) => {
          if (typeof saved === "string" && saved) {
            inputEl.value = saved;
            formatJson(2);
          }
        })
        .catch(() => {});
    </script>
  </body>
</html>
