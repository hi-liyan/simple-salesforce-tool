<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>命令库</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, sans-serif; color: #1e293b; background: #fff; }
      .wrap { display: flex; flex-direction: column; height: 100%; padding: 12px; gap: 10px; }
      .form { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid #e2e8f0; border-radius: 10px; background: #f8fafc; }
      input, textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 6px 8px; font-size: 12px; font-family: inherit; }
      button { border: 1px solid #cbd5e1; border-radius: 8px; padding: 5px 10px; background: #fff; cursor: pointer; font-size: 12px; }
      button.primary { background: #0176d3; border-color: #0176d3; color: #fff; }
      .list { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
      .item { border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; }
      .item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-weight: 600; font-size: 12px; }
      pre { margin: 0 0 8px; padding: 8px; border-radius: 8px; background: #f8fafc; font-family: ui-monospace, Consolas, monospace; font-size: 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="form">
        <input id="title" placeholder="命令名称（如：查询慢日志表）" />
        <textarea id="cmd" rows="2" placeholder="命令内容或 SQL 模板..."></textarea>
        <div style="display:flex;justify-content:flex-end">
          <button class="primary" id="btnAdd">添加命令</button>
        </div>
      </div>
      <div class="list" id="list"></div>
    </div>
    <script>
      let seq = 0;
      function callHost(method, args = {}) {
        return new Promise((resolve, reject) => {
          const requestId = "rpc-" + ++seq;
          function onMsg(ev) {
            const d = ev.data || {};
            if (d.channel !== "sst:plugin-rpc-response" || d.requestId !== requestId) return;
            window.removeEventListener("message", onMsg);
            d.ok ? resolve(d.result) : reject(new Error(d.error || "RPC failed"));
          }
          window.addEventListener("message", onMsg);
          window.parent.postMessage({ channel: "sst:plugin-rpc", requestId, method, args }, "*");
        });
      }

      let items = [];
      const listEl = document.getElementById("list");

      function render() {
        listEl.innerHTML = "";
        items.forEach((item, idx) => {
          const card = document.createElement("div");
          card.className = "item";
          card.innerHTML = `<div class="item-head"><span></span><div style="display:flex;gap:6px"><button data-act="insert">插入编辑器</button><button data-act="copy">复制</button><button data-act="del" style="color:#dc2626">删除</button></div></div><pre></pre>`;
          card.querySelector("span").textContent = item.title;
          card.querySelector("pre").textContent = item.cmd;
          card.querySelector('[data-act="insert"]').onclick = async () => {
            await callHost("workspace.insertTextToActiveEditor", { text: item.cmd });
            await callHost("ui.notify", { message: "已插入命令到编辑器", tone: "success" });
          };
          card.querySelector('[data-act="copy"]').onclick = async () => {
            await navigator.clipboard.writeText(item.cmd);
            await callHost("ui.notify", { message: "已复制到剪贴板", tone: "success" });
          };
          card.querySelector('[data-act="del"]').onclick = async () => {
            items.splice(idx, 1);
            await callHost("storage.set", { key: "commands", value: items });
            render();
          };
          listEl.appendChild(card);
        });
      }

      document.getElementById("btnAdd").onclick = async () => {
        const title = document.getElementById("title").value.trim();
        const cmd = document.getElementById("cmd").value.trim();
        if (!title || !cmd) return;
        items.unshift({ title, cmd });
        document.getElementById("title").value = "";
        document.getElementById("cmd").value = "";
        await callHost("storage.set", { key: "commands", value: items });
        render();
      };

      callHost("init")
        .then(() => callHost("storage.get", { key: "commands" }))
        .then((saved) => {
          if (Array.isArray(saved)) items = saved;
          render();
        })
        .catch(() => render());
    </script>
  </body>
</html>
