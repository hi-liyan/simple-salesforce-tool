<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>二维码生成</title>
    <script src="./qrcode.bundle.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
        color: #1e293b;
        background: #f1f5f9;
        font-size: 12px;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 18px;
        background: #ffffff;
        border-bottom: 1px solid #e2e8f0;
        flex-shrink: 0;
      }
      .topbar-title { font-size: 13px; font-weight: 600; color: #0f172a; }
      .topbar-desc { font-size: 12px; color: #64748b; }
      .grid {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(260px, 0.85fr) minmax(340px, 1.05fr) minmax(300px, 0.9fr);
        gap: 14px;
        padding: 14px;
        overflow: auto;
      }
      @media (max-width: 1080px) {
        .grid { grid-template-columns: 1fr; }
      }
      .card {
        display: flex;
        flex-direction: column;
        min-height: 360px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      }
      .card-hd {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid #e2e8f0;
        flex-shrink: 0;
      }
      .card-hd h3 { margin: 0; font-size: 13px; font-weight: 600; color: #0f172a; }
      .card-hd p { margin: 4px 0 0; font-size: 11px; color: #64748b; line-height: 1.45; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; flex-shrink: 0; }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 30px;
        padding: 0 10px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        color: #334155;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:hover:not(:disabled) { background: #f8fafc; border-color: #94a3b8; }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .btn-ghost { border-color: transparent; background: transparent; }
      .btn-ghost:hover:not(:disabled) { background: #f1f5f9; border-color: transparent; }
      .btn-primary { background: #0176d3; border-color: #0176d3; color: #ffffff; font-weight: 500; }
      .btn-primary:hover:not(:disabled) { background: #0263b0; border-color: #0263b0; }
      .btn-danger { color: #dc2626; }
      .card-bd { flex: 1; min-height: 0; padding: 14px; display: flex; flex-direction: column; }
      textarea {
        flex: 1;
        width: 100%;
        min-height: 240px;
        resize: none;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        padding: 12px;
        font-size: 13px;
        line-height: 1.6;
        outline: none;
        font-family: inherit;
      }
      textarea:focus { border-color: #0176d3; }
      .params-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 10px;
      }
      .color-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 10px;
      }
      .field-label { display: block; margin-bottom: 4px; font-size: 11px; color: #64748b; }
      .input, .select {
        width: 100%;
        height: 34px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 0 10px;
        font-size: 12px;
        background: #ffffff;
        outline: none;
      }
      .input:focus, .select:focus { border-color: #0176d3; }
      .color-row { display: flex; align-items: center; gap: 8px; }
      .swatch-btn {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        padding: 4px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .swatch-inner { display: block; width: 100%; height: 100%; border-radius: 6px; border: 1px solid rgba(15,23,42,0.12); }
      .preview-box {
        flex: 1;
        min-height: 220px;
        margin-top: 12px;
        border: 1px dashed #cbd5e1;
        border-radius: 12px;
        background: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
        gap: 10px;
      }
      .preview-img {
        max-width: 240px;
        max-height: 240px;
        border-radius: 10px;
        border: 1px solid #e2e8f0;
        background: #ffffff;
        padding: 8px;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
      }
      .history-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
      .history-item {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        cursor: pointer;
        transition: border-color 120ms, background 120ms;
      }
      .history-item:hover { border-color: #93c5fd; background: #eff6ff; }
      .history-item.active { border-color: #0176d3; background: #eff6ff; }
      .history-text {
        font-size: 12px;
        font-weight: 500;
        color: #0f172a;
        word-break: break-all;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .history-meta { margin-top: 4px; font-size: 10px; color: #64748b; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <span class="topbar-title">二维码生成</span>
        <span class="topbar-desc">支持自定义纠错等级、边距、缩放与配色，历史记录自动持久化到插件存储。</span>
      </div>

      <div class="grid">
        <!-- 左侧：输入区 -->
        <section class="card">
          <div class="card-hd">
            <div>
              <h3>URL 或其他文本</h3>
              <p>支持粘贴链接、命令或任意文本，生成后自动写入右侧历史记录。</p>
            </div>
            <div class="actions">
              <button type="button" class="btn btn-ghost" id="btnSample">示例</button>
              <button type="button" class="btn btn-ghost" id="btnClear">清空</button>
              <button type="button" class="btn btn-ghost" id="btnCopyText">复制文本</button>
            </div>
          </div>
          <div class="card-bd">
            <textarea id="inputText" placeholder="请输入 URL 或其他文本，然后点击“生成二维码”。"></textarea>
          </div>
        </section>

        <!-- 中间：参数与预览 -->
        <section class="card">
          <div class="card-hd">
            <div>
              <h3>生成参数</h3>
              <p>参数会随历史记录一起保存，下次打开自动恢复。</p>
            </div>
            <div class="actions">
              <button type="button" class="btn btn-ghost" id="btnResetOpts">重置参数</button>
              <button type="button" class="btn btn-primary" id="btnGenerate">生成二维码</button>
            </div>
          </div>
          <div class="card-bd">
            <div class="params-grid">
              <div>
                <span class="field-label">纠错级别</span>
                <select id="optLevel" class="select">
                  <option value="L">L 7%</option>
                  <option value="M" selected>M 15%</option>
                  <option value="Q">Q 25%</option>
                  <option value="H">H 30%</option>
                </select>
              </div>
              <div>
                <span class="field-label">边距留白 (0-8)</span>
                <input id="optMargin" type="number" min="0" max="8" value="0" class="input" />
              </div>
              <div>
                <span class="field-label">缩放倍率 (4-12)</span>
                <input id="optScale" type="number" min="4" max="12" value="12" class="input" />
              </div>
            </div>

            <div class="color-grid">
              <div>
                <span class="field-label">前景色</span>
                <div class="color-row">
                  <button type="button" class="swatch-btn" id="btnDarkSwatch" title="选择前景色">
                    <span class="swatch-inner" id="darkSwatch" style="background:#111827"></span>
                  </button>
                  <input id="optDarkHex" type="text" value="#111827" class="input" style="font-family:monospace" />
                  <input id="optDarkNative" type="color" value="#111827" class="sr-only" />
                </div>
              </div>
              <div>
                <span class="field-label">背景色</span>
                <div class="color-row">
                  <button type="button" class="swatch-btn" id="btnLightSwatch" title="选择背景色">
                    <span class="swatch-inner" id="lightSwatch" style="background:#FFFFFF"></span>
                  </button>
                  <input id="optLightHex" type="text" value="#FFFFFF" class="input" style="font-family:monospace" />
                  <input id="optLightNative" type="color" value="#FFFFFF" class="sr-only" />
                </div>
              </div>
            </div>

            <div class="preview-box" id="previewBox">
              <span style="color:#64748b">输入文本后点击“生成二维码”查看预览</span>
            </div>

            <div class="actions" style="margin-top:10px">
              <button type="button" class="btn" id="btnCopyImg" disabled>复制图片</button>
              <button type="button" class="btn btn-primary" id="btnDownload" disabled>下载 PNG</button>
            </div>
          </div>
        </section>

        <!-- 右侧：历史记录 -->
        <section class="card">
          <div class="card-hd">
            <div>
              <h3>生成历史 (<span id="historyCount">0</span>)</h3>
              <p>点击任意历史条目可立即回填参数并重新生成。</p>
            </div>
            <div class="actions">
              <button type="button" class="btn btn-ghost btn-danger" id="btnClearHistory">清空历史</button>
            </div>
          </div>
          <div class="card-bd">
            <div class="history-list" id="historyList">
              <div style="text-align:center;color:#94a3b8;padding:36px 0">暂无生成历史</div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script>
      const DEFAULT_SAMPLE_TEXT = "https://example.com/simple-salesforce-tool";
      const DEFAULT_OPTIONS = {
        errorCorrectionLevel: "M",
        margin: 0,
        scale: 12,
        darkColor: "#111827",
        lightColor: "#FFFFFF"
      };
      const STORAGE_KEY = "qrCodeState";
      const HISTORY_LIMIT = 20;

      let seq = 0;
      function callHost(method, args = {}) {
        return new Promise((resolve, reject) => {
          const requestId = "rpc-" + ++seq;
          function onMsg(ev) {
            const d = ev.data || {};
            if (d.channel !== "sst:plugin-rpc-response" || d.requestId !== requestId) return;
            window.removeEventListener("message", onMsg);
            d.ok ? resolve(d.result) : reject(new Error(d.error || "RPC failed"));
          }
          window.addEventListener("message", onMsg);
          window.parent.postMessage({ channel: "sst:plugin-rpc", requestId, method, args }, "*");
        });
      }

      function notify(message, tone = "success") {
        void callHost("ui.notify", { message, tone }).catch(() => {});
      }

      const inputEl = document.getElementById("inputText");
      const optLevel = document.getElementById("optLevel");
      const optMargin = document.getElementById("optMargin");
      const optScale = document.getElementById("optScale");
      const optDarkHex = document.getElementById("optDarkHex");
      const optDarkNative = document.getElementById("optDarkNative");
      const darkSwatch = document.getElementById("darkSwatch");
      const optLightHex = document.getElementById("optLightHex");
      const optLightNative = document.getElementById("optLightNative");
      const lightSwatch = document.getElementById("lightSwatch");
      const previewBox = document.getElementById("previewBox");
      const btnCopyImg = document.getElementById("btnCopyImg");
      const btnDownload = document.getElementById("btnDownload");
      const historyListEl = document.getElementById("historyList");
      const historyCountEl = document.getElementById("historyCount");

      let currentOptions = { ...DEFAULT_OPTIONS };
      let historyEntries = [];
      let activeHistoryId = "";
      let currentDataUrl = "";

      function normalizeHex(raw, fallback) {
        const s = String(raw || "").trim().toUpperCase();
        const withHash = s.startsWith("#") ? s : "#" + s;
        return /^#[0-9A-F]{6}$/.test(withHash) ? withHash : fallback;
      }

      function clampInt(raw, fallback, min, max) {
        const n = Number(raw);
        if (!Number.isFinite(n)) return fallback;
        return Math.min(max, Math.max(min, Math.round(n)));
      }

      function syncOptionsToDom() {
        optLevel.value = currentOptions.errorCorrectionLevel;
        optMargin.value = String(currentOptions.margin);
        optScale.value = String(currentOptions.scale);
        optDarkHex.value = currentOptions.darkColor;
        optDarkNative.value = currentOptions.darkColor;
        darkSwatch.style.backgroundColor = currentOptions.darkColor;
        optLightHex.value = currentOptions.lightColor;
        optLightNative.value = currentOptions.lightColor;
        lightSwatch.style.backgroundColor = currentOptions.lightColor;
      }

      function persistState() {
        void callHost("storage.set", {
          key: STORAGE_KEY,
          value: {
            inputText: inputEl.value,
            options: currentOptions,
            history: historyEntries
          }
        }).catch(() => {});
      }

      function renderHistory() {
        historyCountEl.textContent = String(historyEntries.length);
        if (historyEntries.length === 0) {
          historyListEl.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:36px 0">暂无生成历史</div>';
          return;
        }
        historyListEl.innerHTML = "";
        for (const item of historyEntries) {
          const row = document.createElement("div");
          row.className = "history-item" + (item.id === activeHistoryId ? " active" : "");

          const left = document.createElement("div");
          left.style.minWidth = "0";
          left.style.flex = "1";
          const txt = document.createElement("div");
          txt.className = "history-text";
          txt.textContent = item.inputText;
          const meta = document.createElement("div");
          meta.className = "history-meta";
          meta.textContent = `${item.options.errorCorrectionLevel} · margin ${item.options.margin} · scale ${item.options.scale}`;
          left.appendChild(txt);
          left.appendChild(meta);

          const delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "btn btn-ghost btn-danger";
          delBtn.style.height = "24px";
          delBtn.style.padding = "0 6px";
          delBtn.textContent = "删除";
          delBtn.onclick = (ev) => {
            ev.stopPropagation();
            historyEntries = historyEntries.filter((h) => h.id !== item.id);
            if (activeHistoryId === item.id) activeHistoryId = "";
            renderHistory();
            persistState();
          };

          row.onclick = async () => {
            inputEl.value = item.inputText;
            currentOptions = { ...DEFAULT_OPTIONS, ...item.options };
            activeHistoryId = item.id;
            syncOptionsToDom();
            renderHistory();
            await generateQr(false);
          };

          row.appendChild(left);
          row.appendChild(delBtn);
          historyListEl.appendChild(row);
        }
      }

      async function generateQr(saveToHistory = true) {
        const text = inputEl.value.trim();
        if (!text) {
          currentDataUrl = "";
          btnCopyImg.disabled = true;
          btnDownload.disabled = true;
          previewBox.innerHTML = '<span style="color:#64748b">请先输入 URL 或任意文本</span>';
          notify("请先输入 URL 或任意文本。", "warning");
          return;
        }
        try {
          const dataUrl = await window.QRCode.toDataURL(text, {
            errorCorrectionLevel: currentOptions.errorCorrectionLevel,
            margin: currentOptions.margin,
            scale: currentOptions.scale,
            color: {
              dark: currentOptions.darkColor,
              light: currentOptions.lightColor
            }
          });
          currentDataUrl = dataUrl;
          btnCopyImg.disabled = false;
          btnDownload.disabled = false;
          previewBox.innerHTML = `<img src="${dataUrl}" alt="QR Code" class="preview-img" /><span style="font-size:11px;color:#64748b">纠错 ${currentOptions.errorCorrectionLevel} · 倍率 ${currentOptions.scale}</span>`;

          if (saveToHistory) {
            const entry = {
              id: "qr-" + Date.now(),
              inputText: text,
              createdAt: new Date().toISOString(),
              options: { ...currentOptions }
            };
            historyEntries = [entry, ...historyEntries.filter((h) => h.inputText !== text)].slice(0, HISTORY_LIMIT);
            activeHistoryId = entry.id;
            renderHistory();
            notify("二维码已生成。", "success");
          }
          persistState();
        } catch (err) {
          notify("生成失败：" + (err?.message || String(err)), "error");
        }
      }

      // 绑定参数事件。
      optLevel.onchange = () => {
        currentOptions.errorCorrectionLevel = optLevel.value;
        persistState();
      };
      optMargin.onchange = () => {
        currentOptions.margin = clampInt(optMargin.value, 0, 0, 8);
        optMargin.value = String(currentOptions.margin);
        persistState();
      };
      optScale.onchange = () => {
        currentOptions.scale = clampInt(optScale.value, 12, 4, 12);
        optScale.value = String(currentOptions.scale);
        persistState();
      };
      document.getElementById("btnDarkSwatch").onclick = () => optDarkNative.click();
      document.getElementById("btnLightSwatch").onclick = () => optLightNative.click();
      optDarkNative.oninput = () => {
        currentOptions.darkColor = normalizeHex(optDarkNative.value, currentOptions.darkColor);
        syncOptionsToDom();
        persistState();
      };
      optLightNative.oninput = () => {
        currentOptions.lightColor = normalizeHex(optLightNative.value, currentOptions.lightColor);
        syncOptionsToDom();
        persistState();
      };
      optDarkHex.onblur = () => {
        currentOptions.darkColor = normalizeHex(optDarkHex.value, currentOptions.darkColor);
        syncOptionsToDom();
        persistState();
      };
      optLightHex.onblur = () => {
        currentOptions.lightColor = normalizeHex(optLightHex.value, currentOptions.lightColor);
        syncOptionsToDom();
        persistState();
      };
      inputEl.oninput = () => persistState();

      document.getElementById("btnGenerate").onclick = () => void generateQr(true);
      document.getElementById("btnSample").onclick = () => {
        inputEl.value = DEFAULT_SAMPLE_TEXT;
        currentOptions = { ...DEFAULT_OPTIONS };
        syncOptionsToDom();
        persistState();
      };
      document.getElementById("btnClear").onclick = () => {
        inputEl.value = "";
        currentDataUrl = "";
        activeHistoryId = "";
        btnCopyImg.disabled = true;
        btnDownload.disabled = true;
        previewBox.innerHTML = '<span style="color:#64748b">输入文本后点击“生成二维码”查看预览</span>';
        renderHistory();
        persistState();
      };
      document.getElementById("btnResetOpts").onclick = () => {
        currentOptions = { ...DEFAULT_OPTIONS };
        syncOptionsToDom();
        persistState();
        notify("二维码参数已重置为默认值。", "success");
      };
      document.getElementById("btnCopyText").onclick = async () => {
        if (!inputEl.value.trim()) {
          notify("当前没有可复制的输入内容。", "warning");
          return;
        }
        await callHost("clipboard.writeText", { text: inputEl.value });
        notify("输入内容已复制。", "success");
      };
      btnCopyImg.onclick = async () => {
        if (!currentDataUrl) return;
        await callHost("clipboard.writeImage", { dataUrl: currentDataUrl });
        notify("二维码图片已复制。", "success");
      };
      btnDownload.onclick = () => {
        if (!currentDataUrl) return;
        const a = document.createElement("a");
        a.href = currentDataUrl;
        a.download = `qr-code-${Date.now()}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        notify("二维码图片已开始下载。", "success");
      };
      document.getElementById("btnClearHistory").onclick = () => {
        historyEntries = [];
        activeHistoryId = "";
        renderHistory();
        persistState();
      };

      // 启动时从 SQLite plugin_kv_store 恢复历史与草稿。
      (async () => {
        try {
          await callHost("init");
          const saved = await callHost("storage.get", { key: STORAGE_KEY });
          if (saved && typeof saved === "object") {
            if (typeof saved.inputText === "string") inputEl.value = saved.inputText;
            if (saved.options && typeof saved.options === "object") {
              currentOptions = { ...DEFAULT_OPTIONS, ...saved.options };
            }
            if (Array.isArray(saved.history)) {
              historyEntries = saved.history;
            }
          }
          syncOptionsToDom();
          renderHistory();
          if (inputEl.value.trim()) {
            await generateQr(false);
          }
        } catch {
          syncOptionsToDom();
          renderHistory();
        }
      })();
    </script>
  </body>
</html>
