<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>二维码生成</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, sans-serif; color: #1e293b; background: #fff; }
      .wrap { display: flex; flex-direction: column; height: 100%; padding: 12px; gap: 10px; }
      .row { display: flex; gap: 12px; flex: 1; min-height: 0; }
      textarea { flex: 1; resize: none; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px; font-size: 13px; }
      .preview { width: 260px; border: 1px solid #e2e8f0; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; background: #f8fafc; gap: 8px; }
      button { border: 1px solid #cbd5e1; border-radius: 8px; padding: 6px 12px; background: #fff; cursor: pointer; font-size: 12px; }
      button.primary { background: #0176d3; border-color: #0176d3; color: #fff; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div style="display:flex;gap:8px;align-items:center">
        <button class="primary" id="btnGen">保存历史</button>
        <button id="btnReadSel">读取编辑器选区</button>
      </div>
      <div class="row">
        <textarea id="input" placeholder="输入需要生成二维码的文本或 URL..."></textarea>
        <div class="preview">
          <div id="qrBox" style="font-size:12px;color:#64748b;text-align:center">输入内容后自动预览</div>
        </div>
      </div>
    </div>
    <script>
      let seq = 0;
      function callHost(method, args = {}) {
        return new Promise((resolve, reject) => {
          const requestId = "rpc-" + ++seq;
          function onMsg(ev) {
            const d = ev.data || {};
            if (d.channel !== "sst:plugin-rpc-response" || d.requestId !== requestId) return;
            window.removeEventListener("message", onMsg);
            d.ok ? resolve(d.result) : reject(new Error(d.error || "RPC failed"));
          }
          window.addEventListener("message", onMsg);
          window.parent.postMessage({ channel: "sst:plugin-rpc", requestId, method, args }, "*");
        });
      }

      const inputEl = document.getElementById("input");
      const qrBox = document.getElementById("qrBox");

      function renderPreview() {
        const val = inputEl.value.trim();
        if (!val) {
          qrBox.textContent = "输入内容后自动预览";
          return;
        }
        // 生成确定性 SVG 点阵占位预览（完整二维码矩阵可接入第三方库打包进 dist/）。
        const size = 21;
        const cell = 8;
        let rects = "";
        let hash = 2166136261;
        for (let i = 0; i < val.length; i++) {
          hash ^= val.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const inFinder = (x < 7 && y < 7) || (x >= size - 7 && y < 7) || (x < 7 && y >= size - 7);
            const bit = inFinder
              ? (x === 0 || x === 6 || y === 0 || y === 6 || (x >= 2 && x <= 4 && y >= 2 && y <= 4) || x === size - 1 || x === size - 7 || y === size - 1 || y === size - 7)
              : (((hash >> ((x + y) % 24)) ^ (x * 31 + y * 17)) & 1) === 1;
            if (bit) rects += `<rect x="${x * cell}" y="${y * cell}" width="${cell}" height="${cell}" fill="#0f172a"/>`;
          }
        }
        qrBox.innerHTML = `<svg width="${size * cell}" height="${size * cell}" viewBox="0 0 ${size * cell} ${size * cell}" style="background:#fff;padding:8px;border-radius:8px;border:1px solid #e2e8f0">${rects}</svg><div style="font-size:11px;color:#64748b;word-break:break-all;max-height:44px;overflow:hidden">${val.slice(0, 60)}</div>`;
      }

      inputEl.oninput = renderPreview;
      document.getElementById("btnGen").onclick = async () => {
        await callHost("storage.set", { key: "lastText", value: inputEl.value });
        await callHost("ui.notify", { message: "已保存二维码内容", tone: "success" });
      };
      document.getElementById("btnReadSel").onclick = async () => {
        const sel = await callHost("workspace.getActiveEditorSelection");
        if (sel) {
          inputEl.value = sel;
          renderPreview();
        }
      };

      callHost("init")
        .then(() => callHost("storage.get", { key: "lastText" }))
        .then((saved) => {
          if (typeof saved === "string" && saved) {
            inputEl.value = saved;
            renderPreview();
          }
        })
        .catch(() => {});
    </script>
  </body>
</html>
