name: Release Tauri Bundles

on:
  # 仅在推送版本标签时触发发布，例如 v0.1.0
  push:
    tags:
      - "v*"

# 发布 Release 需要写入仓库 contents 权限
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: 产出 MSI + NSIS(EXE) 安装包
          - os: windows-latest
            platform: windows
            bundles: "msi,nsis"
            artifact_name: tauri-windows-installers
            artifact_glob: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          # macOS: 产出 DMG 安装包
          - os: macos-latest
            platform: macos
            bundles: "dmg"
            artifact_name: tauri-macos-installers
            artifact_glob: |
              src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      # 拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 安装 Node.js 并启用 npm 缓存
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 安装 Rust 工具链
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 缓存 Rust 编译产物，缩短构建时间
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # 安装前端依赖
      - name: Install dependencies
        run: npm ci

      # 构建 Tauri 安装包（根据矩阵平台产出不同 bundles）
      - name: Build Tauri bundles
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      # 上传当前平台产出的安装包，供后续发布任务统一上传到 Release
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      # 下载所有平台安装包
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      # 创建或更新与当前标签同名的 Release，并上传安装包
      - name: Create/Update Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Simple Salesforce Tool ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*.msi
            release-artifacts/**/*.exe
            release-artifacts/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
