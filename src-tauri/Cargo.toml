[package]
name = "simple-salesforce-tool"
version = "0.1.0"
description = "Production-ready multi-source Salesforce desktop tool"
authors = ["liyan", "codex"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
tauri = { version = "2.2.5", features = [] }
tauri-plugin-opener = "2.5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
portable-pty = "0.8"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
local-ip-address = "0.6"
mime_guess = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "sync"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
urlencoding = "2.1"
futures-util = "0.3"
rig-core = "0.30.0"
schemars = "1.2"
sqlx = { version = "0.8", default-features = false, features = ["mysql", "runtime-tokio-rustls", "chrono", "json"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
